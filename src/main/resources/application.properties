spring.application.name=payment-service
spring.datasource.url=jdbc:postgresql://localhost:5432/payments
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.data.redis.timeout=2s
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.payrecon.payment.dto

# Browser apps allowed to call this API (the React dashboard)
app.cors.allowed-origins=http://localhost:5173

# --- Login / JWT (LOCAL DEV DEFAULTS ONLY: set real values with env vars before going live) ---
# Shared with reconciliation-service: both must use the SAME secret (min 32 characters)
app.security.jwt-secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
app.security.token-lifetime=1h
# Password for the demo users operator / auditor / admin
app.security.demo-password=${DEMO_PASSWORD:payrecon-demo-123}
